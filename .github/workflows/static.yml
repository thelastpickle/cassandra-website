name: Deploy static content to Pages

on:
  # A push trigger cannot work here: push events read workflows from the pushed
  # commit, and the *_generated branches are cut from feature branches that do
  # not carry this file. workflow_run always runs the default branch's copy.
  workflow_run:
    workflows: ["Build toplevel website"]
    types: [completed]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      branch:
        description: "The _generated branch to deploy"
        required: true

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || format('{0}_generated', github.event.workflow_run.head_branch) }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'content/'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
